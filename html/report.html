<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>รายงานข้อมูลนักเรียน ม.2/3</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://cdn.jsdelivr.net/gh/lazywasabi/thai-web-fonts@7/fonts/LINESeedSansTH/LINESeedSansTH.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "LINE Seed Sans TH", "IBM Plex Sans Thai", Arial, sans-serif;
      color: #223049;
      background:
        radial-gradient(circle at 24% 7%, rgba(255,255,255,.72) 0 12%, transparent 27%),
        radial-gradient(circle at 82% 0%, rgba(184,224,255,.58), transparent 32%),
        linear-gradient(180deg, rgba(233,244,255,.18), rgba(255,255,255,.72) 78%, #eef7ff),
        url("m1-dashboard-bg.webp");
      background-size: cover;
      background-position: center;
      display: grid;
      place-items: center;
      padding: 18px 18px 150px;
    }

    body.page-leaving .phone {
      opacity: .18;
      filter: blur(7px);
      transform: translateY(12px) scale(.985);
      transition: opacity .32s ease, filter .32s ease, transform .32s ease;
    }

    body.page-leaving .bottom-nav {
      opacity: .24;
      transform: translateX(-50%) translateY(16px) scale(.96);
      transition: opacity .32s ease, transform .32s ease;
    }

    body.document-ready {
      display: block;
      background-attachment: fixed;
    }

    body.preview-open {
      overflow: hidden;
    }

    .phone {
      width: min(430px, 100%);
      min-height: min(892px, calc(100vh - 28px));
      border: 1.5px solid rgba(255,255,255,.48);
      border-radius: 34px;
      padding: 28px 14px 24px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.56) 82%, rgba(239,249,255,.72)),
        rgba(255,255,255,.08);
      box-shadow: 0 30px 90px rgba(62,86,122,.18), inset 0 1px 0 rgba(255,255,255,.58);
      backdrop-filter: blur(5px) saturate(1.08);
      position: relative;
      overflow: visible;
    }

    .phone::before {
      content: "";
      position: absolute;
      inset: 9px;
      border-radius: 28px;
      border: 1px solid rgba(255,255,255,.34);
      pointer-events: none;
    }

    body.document-ready .phone {
      margin: 0 auto 26px;
    }

    body.document-ready .bottom-nav {
      display: grid;
    }

    .logo {
      width: 100%;
      min-height: 112px;
      border-radius: 27px;
      background: linear-gradient(180deg, rgba(255,255,255,.82), rgba(255,255,255,.56));
      border: 1px solid rgba(255,255,255,.78);
      box-shadow: 0 16px 36px rgba(50,74,111,.12), inset 0 1px 0 rgba(255,255,255,.94);
      backdrop-filter: blur(18px) saturate(1.08);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      position: relative;
      z-index: 1;
    }

    .logo img {
      width: min(248px, 76%);
      max-height: 78px;
      object-fit: contain;
      filter: drop-shadow(0 12px 18px rgba(31,45,70,.16));
    }

    .bottom-nav {
      --active-index: 2;
      position: fixed;
      z-index: 60;
      left: 50%;
      bottom: calc(28px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      width: min(80vw, 330px);
      height: 78px;
      padding: 10px 18px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      align-items: center;
      border-radius: 999px;
      background: rgba(255,255,255,.84);
      border: 1px solid rgba(255,255,255,.94);
      box-shadow: 0 18px 42px rgba(42,57,82,.14), 0 0 44px rgba(255,255,255,.48), inset 0 1px 0 rgba(255,255,255,.96);
      backdrop-filter: blur(24px) saturate(1.18);
      transition: opacity .24s ease, transform .24s ease, box-shadow .24s ease;
    }

    .bottom-nav::before {
      content: "";
      position: absolute;
      z-index: 0;
      top: 10px;
      bottom: 10px;
      left: 18px;
      width: calc((100% - 36px - 16px) / 3);
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255,247,248,.96), rgba(255,236,236,.78));
      box-shadow: 0 10px 24px rgba(255,124,85,.14), 0 0 34px rgba(255,131,118,.14), inset 0 1px 0 rgba(255,255,255,.9);
      transform: translateX(calc(var(--active-index) * (100% + 8px)));
      transition: transform .28s cubic-bezier(.2,.9,.2,1), background .22s ease, box-shadow .22s ease;
    }

    .bottom-nav-item {
      position: relative;
      z-index: 1;
      height: 58px;
      min-width: 0;
      border: 0;
      border-radius: 999px;
      background: transparent;
      display: grid;
      place-items: center;
      text-decoration: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform .2s cubic-bezier(.2,.9,.2,1), filter .2s ease;
    }

    .bottom-nav-item img {
      max-width: 66px;
      max-height: 42px;
      object-fit: contain;
      filter: grayscale(1) saturate(0) opacity(.48) drop-shadow(0 5px 8px rgba(0,0,0,.08));
      transform: scale(.86);
      transition: transform .2s cubic-bezier(.2,.9,.2,1), filter .2s ease, opacity .2s ease;
    }

    .bottom-nav-item.is-active {
      transform: translateY(-2px);
    }

    .bottom-nav-item.is-active img {
      filter: grayscale(0) saturate(1.08) opacity(1) drop-shadow(0 9px 12px rgba(255,124,85,.22));
      transform: scale(1.02);
    }

    .report-launcher {
      position: fixed;
      inset: 0;
      z-index: 78;
      display: none;
      background: rgba(255,255,255,.08);
      backdrop-filter: blur(2px) saturate(1.02);
    }

    body.report-launcher-open .phone {
      filter: blur(2px);
      transform: scale(.992);
      transition: filter .22s ease, transform .22s ease;
    }

    .report-launcher.show {
      display: block;
    }

    .report-launch-card {
      position: fixed;
      left: 50%;
      bottom: calc(112px + env(safe-area-inset-bottom));
      width: min(80vw, 330px);
      transform: translateX(-50%);
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      background: transparent;
      border: 0;
      box-shadow: none;
      padding: 0;
      pointer-events: none;
    }

    .report-launch-button,
    .report-update-button {
      grid-column: 3;
      width: 122px;
      height: 58px;
      justify-self: center;
      border: 0;
      border-radius: 999px;
      background: rgba(255,255,255,.94);
      box-shadow: 0 18px 34px rgba(31,45,70,.2), inset 0 1px 0 rgba(255,255,255,.96);
      display: grid;
      place-items: center;
      padding: 9px 13px;
      text-decoration: none;
      pointer-events: auto;
    }

    .report-update-button {
      grid-row: 1;
      color: #1f65c7;
      font: inherit;
      font-weight: 800;
      letter-spacing: 0;
      cursor: pointer;
      background: rgba(255,255,255,.94);
    }

    .report-launch-button {
      grid-row: 2;
    }

    .report-update-button:disabled {
      color: #7a8798;
      cursor: wait;
      background: rgba(244,247,251,.94);
    }

    .report-update-button img {
      width: 100%;
      max-height: 30px;
      object-fit: contain;
      filter: drop-shadow(0 8px 12px rgba(255,97,103,.2));
    }

    .report-update-button.is-updating img {
      opacity: .55;
    }

    .report-launch-button img {
      width: 100%;
      max-height: 40px;
      object-fit: contain;
      filter: drop-shadow(0 10px 14px rgba(31,45,70,.16));
    }

    .form-card {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 11px;
    }

    .tabs,
    .search,
    .section-title,
    .period,
    .note-strip,
    .room-buttons-panel,
    .actions {
      width: 100%;
      margin-top: 10px;
    }

    .tabs,
    .search,
    .period,
    .note-strip {
      display: flex;
      gap: 8px;
      border-radius: 28px;
      background: rgba(255,255,255,.68);
      padding: 7px;
      box-shadow: 0 10px 24px rgba(38,55,82,.09), inset 0 1px 0 rgba(255,255,255,.96);
      border: 1px solid rgba(255,255,255,.72);
      backdrop-filter: blur(18px) saturate(1.1);
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    button {
      transition: transform .18s cubic-bezier(.2,.9,.2,1), box-shadow .18s ease, background .18s ease, opacity .18s ease;
    }

    button:active,
    a:active {
      transform: scale(.97);
    }

    button:disabled {
      cursor: wait;
      opacity: .72;
      transform: none;
    }

    #createPdf:disabled {
      background: linear-gradient(180deg, rgba(213,220,231,.95), rgba(189,199,213,.9));
      color: rgba(82,96,119,.82);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.46);
      cursor: not-allowed;
    }

    .feedback-pop {
      animation: feedbackPop .34s cubic-bezier(.2,.9,.2,1);
    }

    .feedback-wiggle {
      animation: feedbackWiggle .38s cubic-bezier(.2,.9,.2,1);
    }

    @keyframes feedbackPop {
      0% { transform: scale(1); }
      38% { transform: scale(.92); }
      72% { transform: scale(1.055); }
      100% { transform: scale(1); }
    }

    @keyframes feedbackWiggle {
      0%, 100% { transform: translateY(-2px) rotate(0) scale(1.02); }
      25% { transform: translateY(-3px) rotate(-4deg) scale(1.08); }
      55% { transform: translateY(-2px) rotate(3deg) scale(1.04); }
    }

    .tab,
    .period button,
    .note-strip button {
      flex: 1;
      border: 0;
      border-radius: 999px;
      background: transparent;
      padding: 11px 10px;
      cursor: pointer;
      font-size: 17px;
      font-weight: 700;
      color: #5e738f;
    }

    .tab.active,
    .period button.active {
      background: rgba(232,243,255,.9);
      color: #3169c7;
      box-shadow: 0 8px 20px rgba(61,116,202,.12), inset 0 0 0 2px rgba(98,154,225,.16), inset 0 1px 0 rgba(255,255,255,.72);
    }

    .note-strip button {
      background: rgba(255,255,255,.58);
      color: #34425b;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.72);
    }

    .student-finder.hide {
      display: none;
    }

    .room-buttons-panel {
      display: none;
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(255,255,255,.74), rgba(255,255,255,.52));
      padding: 10px;
      box-shadow: 0 12px 24px rgba(38,55,82,.07), inset 0 1px 0 rgba(255,255,255,.96);
      border: 1px solid rgba(255,255,255,.82);
      backdrop-filter: blur(22px) saturate(1.08);
      overflow: hidden;
    }

    .room-buttons-panel.show {
      display: grid;
      gap: 7px;
    }

    .room-buttons-title {
      font-size: 15px;
      font-weight: 700;
      color: #566984;
      text-align: left;
      padding: 2px 10px 0;
    }

    .room-buttons {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      overscroll-behavior-x: contain;
      scroll-snap-type: x proximity;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      padding: 2px 2px 7px;
    }

    .room-buttons::-webkit-scrollbar {
      display: none;
    }

    .room-button {
      flex: 0 0 auto;
      min-width: 74px;
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      background: rgba(255,255,255,.9);
      color: #60738f;
      cursor: pointer;
      font-weight: 700;
      scroll-snap-align: start;
      box-shadow: 0 9px 18px rgba(38,55,82,.055), inset 0 1px 0 rgba(255,255,255,.92);
    }

    .room-button.active {
      background: rgba(232,243,255,.94);
      color: #3169c7;
      box-shadow: 0 9px 20px rgba(61,116,202,.12), inset 0 0 0 2px rgba(98,154,225,.16), inset 0 1px 0 rgba(255,255,255,.72);
    }

    .room-picker {
      display: grid;
      gap: 10px;
    }

    .room-select {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .room-modal-buttons {
      border-radius: 24px;
      padding: 8px;
      background: rgba(255,255,255,.46);
      border: 1px solid rgba(255,255,255,.72);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.84);
    }

    .room-modal-buttons .room-button {
      min-width: 82px;
      text-align: center;
    }

    .date-fields {
      display: grid;
      gap: 10px;
    }

    .date-fields label {
      display: grid;
      gap: 6px;
      min-height: auto;
      border-radius: 22px;
      padding: 10px 12px;
      background: rgba(255,255,255,.66);
      border: 1px solid rgba(255,255,255,.72);
      font-weight: 700;
    }

    .date-fields input,
    .date-fields textarea {
      width: 100%;
      border: 1px solid rgba(126,151,184,.16);
      border-radius: 17px;
      padding: 10px 12px;
      background: rgba(255,255,255,.88);
      color: #172033;
      font-weight: 600;
      outline: none;
    }

    .date-fields textarea {
      min-height: 128px;
      resize: vertical;
      line-height: 1.55;
    }

    .date-native {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .date-value-button {
      width: 100%;
      min-height: 50px;
      border: 1px solid rgba(126,151,184,.16);
      border-radius: 17px;
      padding: 10px 13px;
      background: rgba(255,255,255,.9);
      color: #172033;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font: inherit;
      font-weight: 800;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.92);
    }

    .date-value-button::after {
      content: "⌄";
      width: 28px;
      height: 28px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      color: #356ec7;
      background: rgba(231,242,255,.92);
      font-size: 16px;
      line-height: 1;
    }

    .date-picker-card {
      display: none;
      border-radius: 24px;
      padding: 12px;
      background: rgba(255,255,255,.82);
      border: 1px solid rgba(221,232,246,.86);
      box-shadow: 0 16px 34px rgba(31,45,70,.10), inset 0 1px 0 rgba(255,255,255,.94);
    }

    .date-picker-card.show {
      display: grid;
      gap: 10px;
    }

    .picker-head {
      display: grid;
      grid-template-columns: 36px 1fr 36px;
      align-items: center;
      gap: 8px;
    }

    .picker-title {
      color: #223049;
      text-align: center;
      font-size: 15px;
      font-weight: 800;
    }

    .picker-nav {
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 999px;
      background: rgba(235,244,254,.96);
      color: #356ec7;
      cursor: pointer;
      font-size: 20px;
      font-weight: 800;
    }

    .calendar-weekdays,
    .calendar-days,
    .month-grid-picker {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 5px;
    }

    .calendar-weekdays {
      color: #7a8596;
      font-size: 11px;
      font-weight: 800;
      text-align: center;
      padding: 0 2px;
    }

    .calendar-day,
    .month-choice {
      border: 0;
      border-radius: 14px;
      background: transparent;
      color: #223049;
      cursor: pointer;
      font: inherit;
      font-weight: 800;
    }

    .calendar-day {
      aspect-ratio: 1;
      min-width: 0;
      font-size: 13px;
    }

    .calendar-day.muted {
      color: #a9b1bd;
    }

    .calendar-day.active,
    .month-choice.active {
      background: linear-gradient(135deg, #356ec7, #2d8bd9);
      color: white;
      box-shadow: 0 8px 16px rgba(45,110,199,.24);
    }

    .month-grid-picker {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px 7px;
    }

    .month-choice {
      min-height: 46px;
      padding: 8px 6px;
      background: rgba(235,244,254,.72);
      font-size: 12px;
      line-height: 1.12;
      overflow-wrap: anywhere;
    }

    .picker-today {
      border: 0;
      border-radius: 999px;
      padding: 9px 12px;
      background: rgba(232,250,238,.88);
      color: #23804d;
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      font-weight: 800;
    }

    .room-list {
      display: none;
      max-height: 260px;
      overflow: auto;
      gap: 7px;
      border-radius: 24px;
      padding: 8px;
      background: rgba(255,255,255,.74);
      border: 1px solid rgba(255,255,255,.74);
      box-shadow: 0 14px 28px rgba(38,55,82,.08);
    }

    .room-list.show {
      display: grid;
    }

    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(49,67,96,.22);
      padding: 24px;
      place-items: center;
      backdrop-filter: blur(12px) saturate(1.08);
    }

    .modal-backdrop.show {
      display: grid;
    }

    .room-modal {
      width: min(430px, 100%);
      max-height: min(760px, 88vh);
      overflow: hidden;
      border-radius: 30px;
      background: rgba(255,255,255,.88);
      border: 1px solid rgba(255,255,255,.82);
      box-shadow: 0 24px 70px rgba(31,45,70,.18), inset 0 1px 0 rgba(255,255,255,.9);
      backdrop-filter: blur(22px) saturate(1.1);
      padding: 16px;
      display: grid;
      gap: 12px;
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .modal-title {
      font-size: 19px;
      font-weight: 700;
      color: #223049;
    }

    .modal-close {
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 999px;
      background: rgba(235,244,254,.86);
      color: #697386;
      cursor: pointer;
      font-size: 24px;
      line-height: 1;
    }

    .search input {
      min-width: 0;
      flex: 1;
      border: 0;
      background: transparent;
      padding: 15px 14px;
      outline: none;
      font-weight: 600;
      color: #223049;
      font-size: 16px;
    }

    .folder-btn {
      width: 54px;
      min-height: 54px;
      border: 0;
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(230,245,255,.98), rgba(214,235,255,.88));
      color: #356ec7;
      cursor: pointer;
      display: grid;
      place-items: center;
      box-shadow: 0 10px 20px rgba(52,112,176,.12), inset 0 1px 0 rgba(255,255,255,.92);
      position: relative;
    }

    .folder-btn svg {
      width: 29px;
      height: 29px;
      display: block;
      filter: drop-shadow(0 5px 8px rgba(28,39,76,.12));
    }

    .search input::placeholder {
      color: rgba(105,115,134,.7);
    }

    .search-panel {
      position: relative;
    }

    .suggestions {
      display: none;
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 8px);
      z-index: 20;
      max-height: 230px;
      overflow: auto;
      border-radius: 24px;
      background: rgba(255,255,255,.92);
      box-shadow: 0 20px 44px rgba(29,45,74,.16);
      padding: 8px;
      border: 1px solid rgba(255,255,255,.82);
      backdrop-filter: blur(14px);
    }

    .suggestions.show {
      display: grid;
      gap: 6px;
    }

    .suggestion {
      width: 100%;
      border: 1px solid rgba(126,151,184,.12);
      border-radius: 18px;
      background: rgba(255,255,255,.76);
      padding: 10px 12px;
      text-align: left;
      cursor: pointer;
      color: #172033;
    }

    .suggestion strong,
    .suggestion small {
      display: block;
    }

    .suggestion small {
      margin-top: 2px;
      color: #666;
    }

    .section-title {
      border: 0;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255,199,91,.95), rgba(255,173,88,.92));
      color: white;
      padding: 13px 16px;
      text-align: center;
      font-size: 18px;
      font-weight: 700;
      box-shadow: 0 12px 24px rgba(255,143,112,.20), inset 0 1px 0 rgba(255,255,255,.42);
      cursor: pointer;
    }

    button.section-title {
      font: inherit;
      width: 100%;
    }

    .panel {
      margin-top: 10px;
      border-radius: 28px;
      background: rgba(255,255,255,.72);
      padding: 16px;
      box-shadow: 0 18px 44px rgba(38,55,82,.10), inset 0 1px 0 rgba(255,255,255,.92);
      border: 1px solid rgba(255,255,255,.76);
      backdrop-filter: blur(16px);
    }

    .student-fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .student-fields input,
    .student-fields select {
      width: 100%;
      border: 1px solid rgba(126,151,184,.16);
      border-radius: 18px;
      padding: 11px 12px;
      background: rgba(255,255,255,.84);
      font-weight: 600;
      outline: none;
      color: #172033;
    }

    .checks {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px 10px;
      font-size: 16px;
    }

    .selection-hint {
      text-align: center;

    async function downloadPdfDocument() {
      const button = document.getElementById("downloadPdf");
      const sheets = document.getElementById("printSheets");
      if (!sheets || !sheets.children.length) return;

      const jsPDFCtor = window.jspdf && window.jspdf.jsPDF;
      if (!window.html2canvas || !jsPDFCtor) {
        alert("ยังโหลดเครื่องมือดาวน์โหลด PDF ไม่สำเร็จ กรุณาต่ออินเทอร์เน็ตแล้วลองใหม่อีกครั้ง");
        return;
      }

      const originalText = button.textContent;
      button.disabled = true;
      button.textContent = "กำลังทำไฟล์ PDF...";

      let exportLayer = null;

      try {
        if (document.fonts?.ready) await document.fonts.ready;

        // สร้างเอกสารสำหรับ export แยกจาก preview โดยใช้ px คงที่ของ A4
        // เพื่อเลี่ยงปัญหา mm/zoom ของ browser ที่ทำให้ภาพแตก ซ้อน หรือ crop
        exportLayer = document.createElement("div");
        exportLayer.id = "pdfExportLayer";
        exportLayer.setAttribute("aria-hidden", "true");
        setExportStyle(exportLayer, {
          position: "absolute",
          left: "0",
          top: "0",
          width: "794px",
          background: "#ffffff",
          overflow: "visible",
          pointerEvents: "none",
          zIndex: "-1"
        });

        const clone = sheets.cloneNode(true);
        clone.id = "pdfExportSheets";
        setExportStyle(clone, {
          display: "block",
          width: "794px",
          background: "#ffffff",
          overflow: "visible"
        });

        const exportSheets = Array.from(clone.querySelectorAll(".print-sheet"));
        exportSheets.forEach((sheet, index) => {
          setExportStyle(sheet, {
            display: "block",
            width: "794px",
            height: "1123px",
            minHeight: "1123px",
            maxHeight: "1123px",
            margin: "0",
            padding: "60px 68px 68px",
            boxSizing: "border-box",
            boxShadow: "none",
            background: "#ffffff",
            color: "#000000",
            overflow: "hidden",
            transform: "none",
            zoom: "1",
            pageBreakAfter: index === exportSheets.length - 1 ? "auto" : "always",
            breakAfter: index === exportSheets.length - 1 ? "auto" : "page"
          });
        });

        exportLayer.appendChild(clone);
        document.body.appendChild(exportLayer);

        await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        await new Promise(resolve => setTimeout(resolve, 250));

        const pdf = new jsPDFCtor({ unit: "mm", format: "a4", orientation: "portrait", compress: true });
        const pageElements = Array.from(exportLayer.querySelectorAll(".print-sheet"));

        // Shield from modern CSS lab/oklch colors
        const origGPV = CSSStyleDeclaration.prototype.getPropertyValue;
        CSSStyleDeclaration.prototype.getPropertyValue = function(prop) {
          const val = origGPV.call(this, prop);
          if (val && (val.includes("lab(") || val.includes("oklch(") || val.includes("color("))) {
            return prop.includes("background") ? "rgb(255, 255, 255)" : "rgb(0, 0, 0)";
          }
          return val;
        };

        const scale = 2; // Optimal high-res without crashing iOS/Android mobile memory

        for (let i = 0; i < pageElements.length; i += 1) {
          const page = pageElements[i];
          const canvas = await window.html2canvas(page, {
            scale,
            useCORS: true,
            allowTaint: false,
            backgroundColor: "#ffffff",
            logging: false,
            scrollX: 0,
            scrollY: 0,
            width: 794,
            height: 1123,
            windowWidth: 794,
            windowHeight: 1123,
            removeContainer: true
          });

          if (!canvas.width || !canvas.height) {
            throw new Error("จับภาพหน้าเอกสารไม่สำเร็จ");
          }

          const imageData = canvas.toDataURL("image/png");
          if (i > 0) pdf.addPage("a4", "portrait");
          pdf.addImage(imageData, "PNG", 0, 0, 210, 297, undefined, "SLOW");
        }

        pdf.save(pdfFileName());
        playTapTone("success");
        vibrateFor("success");
      } catch (error) {
        playTapTone("error");
        vibrateFor("error");
        alert("ดาวน์โหลด PDF ไม่สำเร็จ: " + (error.message || String(error)));
      } finally {
        if (exportLayer) exportLayer.remove();
        button.disabled = false;
        button.textContent = originalText;
      }
    }

    function playTapTone(kind = "tap") {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        feedbackAudioCtx = feedbackAudioCtx || new AudioCtx();
        if (feedbackAudioCtx.state === "suspended") feedbackAudioCtx.resume();

        const now = feedbackAudioCtx.currentTime;
        const tones = {
          success: [660, 880, 1175],
          error: [220, 165],
          warning: [440, 620],
          nav: [520, 760],
          select: [680, 900],
          tap: [600, 760]
        };
        const freqs = tones[kind] || tones.tap;

        freqs.forEach((freq, index) => {
          const start = now + index * .055;
          const osc = feedbackAudioCtx.createOscillator();
          const gain = feedbackAudioCtx.createGain();
          osc.type = kind === "error" ? "triangle" : "sine";
          osc.frequency.setValueAtTime(freq, start);
          gain.gain.setValueAtTime(.0001, start);
          gain.gain.exponentialRampToValueAtTime(kind === "success" ? .06 : kind === "error" ? .045 : .035, start + .01);
          gain.gain.exponentialRampToValueAtTime(.0001, start + .105);
          osc.connect(gain).connect(feedbackAudioCtx.destination);
          osc.start(start);
          osc.stop(start + .12);
        });
      } catch (error) {}
    }

    function vibrateFor(kind = "tap") {
      if (!navigator.vibrate) return;
      const patterns = {
        success: [18, 24, 18],
        error: [28, 36, 28],
        nav: [12, 24, 12],
        select: 18,
        tap: 10
      };
      navigator.vibrate(patterns[kind] || patterns.tap);
    }

    function tactileFeedback(target, kind = "tap") {
      const now = Date.now();
      if (now - lastFeedbackAt < 45) return;
      lastFeedbackAt = now;
      vibrateFor(kind);
      playTapTone(kind);

      const el = target?.closest?.("button,a,.behavior-option,.bottom-nav-item,.suggestion,.room-button") || target;
      if (!el || !el.classList) return;
      const cls = kind === "nav" ? "feedback-wiggle" : "feedback-pop";
      el.classList.remove(cls);
      void el.offsetWidth;
      el.classList.add(cls);
      setTimeout(() => el.classList.remove(cls), 430);
    }

    document.addEventListener("pointerdown", (event) => {

      const kind = target.closest(".bottom-nav")
        ? "nav"
        : target.classList.contains("behavior-option") || target.classList.contains("room-button")
          ? "select"
          : "tap";
      tactileFeedback(target, kind);
    }, {passive: true});

    async function updateToLatestVersion(button) {
      try {
        if (button) {
          button.disabled = true;
          button.classList.add("is-updating");
        }
        showUpdatePopup();
        try {
          localStorage.setItem("m1:update:done", "1");
        } catch (error) {}
        if ("serviceWorker" in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map((reg) => reg.unregister()));
        }
        if ("caches" in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map((key) => caches.delete(key)));
        }
        try {
          sessionStorage.clear();
        } catch (error) {}
        await new Promise((resolve) => setTimeout(resolve, 1300));
        const freshUrl = new URL(window.location.href);
        freshUrl.searchParams.set("v", Date.now().toString());
        window.location.replace(freshUrl.toString());

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({

        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      }[char]));

    function jsonpFrom(url, action, params = {}) {
      return new Promise((resolve, reject) => {
        const cb = "m1_report_cb_" + Date.now() + "_" + Math.floor(Math.random() * 100000);
        const script = document.createElement("script");
        const timer = setTimeout(() => {
          cleanup();
          reject(new Error("เชื่อมต่อช้าเกินไป กรุณาลองใหม่"));
        }, 30000);

        function cleanup() {
          clearTimeout(timer);
          delete window[cb];
          script.remove();
        }

        window[cb] = (data) => {
          cleanup();
          resolve(data);
        };

        const qs = new URLSearchParams({...params, action, callback: cb});
        script.onerror = () => {
          cleanup();
          reject(new Error("เชื่อมต่อ Apps Script ไม่สำเร็จ"));
        };
        script.src = url + "?" + qs.toString();
        document.body.appendChild(script);
      });
    }

    function localIsoDate(date = new Date()) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function localMonth(date = new Date()) {
      return localIsoDate(date).slice(0, 7);
    }

    function dateFromIso(value) {
      const match = String(value || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!match) return new Date();
      return new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]));
    }

    function formatThaiDateShort(value) {
      const date = dateFromIso(value);
      return `${String(date.getDate()).padStart(2, "0")} ${thaiMonths[date.getMonth()]} ${date.getFullYear() + 543}`;
    }

    function formatThaiMonth(value) {
      const [yearText, monthText] = String(value || localMonth()).split("-");
      const year = Number(yearText) || new Date().getFullYear();
      const monthIndex = Math.max(0, Math.min(11, (Number(monthText) || 1) - 1));
      return `${thaiMonths[monthIndex]} ${year + 543}`;
    }

    function parseIsoLocal(value) {
      const match = String(value || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!match) return null;
      return new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]));
    }

    function normalizeYear(yearText) {
      const year = Number(yearText);
      if (!Number.isFinite(year)) return "";
      return String(year > 2400 ? year - 543 : year).padStart(4, "0");
    }

    function normalizeRecordDate(value) {
      const raw = String(value || "").trim();
      if (!raw) return "";

      const iso = raw.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
      if (iso) {
        return `${normalizeYear(iso[1])}-${String(iso[2]).padStart(2, "0")}-${String(iso[3]).padStart(2, "0")}`;
      }

      const slash = raw.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
      if (slash) {
        return `${normalizeYear(slash[3])}-${String(slash[2]).padStart(2, "0")}-${String(slash[1]).padStart(2, "0")}`;
      }

      const thaiMonthNames = {
        "มกราคม": 1, "ม.ค.": 1, "ม.ค": 1,
        "กุมภาพันธ์": 2, "ก.พ.": 2, "ก.พ": 2,
        "มีนาคม": 3, "มี.ค.": 3, "มี.ค": 3,
        "เมษายน": 4, "เม.ย.": 4, "เม.ย": 4,
        "พฤษภาคม": 5, "พ.ค.": 5, "พ.ค": 5,
        "มิถุนายน": 6, "มิ.ย.": 6, "มิ.ย": 6,
        "กรกฎาคม": 7, "ก.ค.": 7, "ก.ค": 7,
        "สิงหาคม": 8, "ส.ค.": 8, "ส.ค": 8,
        "กันยายน": 9, "ก.ย.": 9, "ก.ย": 9,
        "ตุลาคม": 10, "ต.ค.": 10, "ต.ค": 10,
        "พฤศจิกายน": 11, "พ.ย.": 11, "พ.ย": 11,
        "ธันวาคม": 12, "ธ.ค.": 12, "ธ.ค": 12
      };
      const thaiDate = raw.match(/(\d{1,2})\s*([ก-ฮ.]+)\s*(\d{4})/);
      if (thaiDate && thaiMonthNames[thaiDate[2]]) {
        return `${normalizeYear(thaiDate[3])}-${String(thaiMonthNames[thaiDate[2]]).padStart(2, "0")}-${String(thaiDate[1]).padStart(2, "0")}`;
      }

      const parsed = new Date(raw);
      if (!Number.isNaN(parsed.getTime())) return localIsoDate(parsed);
      return "";
    }

    function getRecordDate(record = {}) {
      return normalizeRecordDate(firstFilled(
        record.date,
        record.recordDate,
        record.day,
        record.createdDate,
        record.recordedAt,
        record.createdAt,
        record.timestamp,
        record["วันที่"],
        record["วัน"]
      ));
    }

    function normalizeReportRecord(record = {}) {
      const date = getRecordDate(record);
      return {
        ...record,
        room: canonicalRoomName(record.room || record.classRoom || record.class || record["ห้อง"] || record["ชั้น"]),
        behaviorType: normalizeBehaviorName(record.behaviorType || record.type || record.behavior || record["ประเภทพฤติกรรม"] || record["พฤติกรรม"]),
        actionType: getActionText(record),
        ...(date ? {date} : {})
      };
    }

    function formatThaiDate(value) {
      const normalized = normalizeRecordDate(value) || value;
      const date = parseIsoLocal(normalized) || new Date(normalized);
      if (Number.isNaN(date.getTime())) return value || "-";
      return `${date.getDate()} ${thaiMonths[date.getMonth()]} ${date.getFullYear() + 543}`;
    }

    function lastDayOfMonth(monthValue) {
      const [year, month] = String(monthValue || localMonth()).split("-").map(Number);
      return localIsoDate(new Date(year, month, 0));
    }

    function currentAcademicYearStart() {
      const now = new Date();
      const year = now.getMonth() + 1 >= 5 ? now.getFullYear() : now.getFullYear() - 1;
      return `${year}-05-01`;
    }

    function selectedDateBounds(records = []) {
      const today = localIsoDate();
      if (selectedPeriod === "วัน") {
        const from = selectedDateFrom || today;
        const to = selectedDateTo || from;
        return from <= to ? {from, to} : {from: to, to: from};
      }
      if (selectedPeriod === "เดือน") {
        const month = selectedMonth || localMonth();
        const from = `${month}-01`;
        const monthEnd = lastDayOfMonth(month);
        const to = month === localMonth() && today < monthEnd ? today : monthEnd;
        return {from, to};
      }
      const from = currentAcademicYearStart();
      const yearEnd = lastDayOfMonth(`${Number(from.slice(0, 4)) + 1}-04`);
      const to = today < yearEnd ? today : yearEnd;
      return {from, to};
    }

    function dateRange(records) {
      const {from, to} = selectedDateBounds(records);
      if (!from || !to) return "-";
      return `${formatThaiDate(from)} - ${formatThaiDate(to)}`;
    }

    function filterRecordsBySelectedPeriod(records) {
      const items = records || [];
      const {from, to} = selectedDateBounds(items);
      return items.filter((record) => {
        const date = getRecordDate(record);
        return date && date >= from && date <= to;
      });
    }

    function buildReportPeriodParams() {
      // ดึงข้อมูลจากหลังบ้านแบบกว้างที่สุดก่อน แล้วค่อยกรองช่วงเวลาในหน้าเว็บ
      // เพื่อให้รายห้อง/รายบุคคลใช้ตรรกะเดียวกัน และไม่พังจาก period คนละชื่อใน Apps Script
      return {
        period: "all"
      };
    }

    function totalText(report) {
      const total = Number(report.total || 0);
      if (selectedMode === "room") {
        const people = Array.isArray(report.topStudents) ? report.topStudents.length : 0;
        return `รวมทั้งหมด : ${people} คน ${total} ครั้ง`;
      }
      return `รวมทั้งหมด : ${total} ครั้ง`;
    }

    function groupBy(records, key) {
      return (records || []).reduce((map, record) => {
        const name = key === "behaviorType" ? normalizeBehaviorName(record[key]) : (record[key] || "ไม่ระบุ");
        if (!map[name]) map[name] = [];
        map[name].push(record);
        return map;
      }, {});
    }

    function normalizeBehaviorName(value) {
      return String(value || "").replace(/\s+/g, " ").trim() || "ไม่ระบุ";
    }

    function normalizeRoomValue(value) {
      return String(value || "")
        .trim()
        .replace(/\s+/g, "")
        .replace(/^ม\.?/, "")
        .replace(/^มัธยมศึกษาปีที่/, "")
        .replace(/^ชั้น/, "");
    }

    function canonicalRoomName(value) {
      const rooms = ["ม.1/1", "ม.1/2", "ม.1/3", "ม.1/4", "ม.1/5", "ม.1/6", "ม.1/7", "ม.1/8", "ม.1/A", "ม.1/B"];
      const normalized = normalizeRoomValue(value);
      return rooms.find((room) => normalizeRoomValue(room) === normalized) || String(value || "ไม่ระบุห้อง").trim() || "ไม่ระบุห้อง";
    }

    function firstFilled(...values) {
      const found = values.find((value) => value !== undefined && value !== null && String(value).trim() !== "");
      return found === undefined ? "" : found;
    }

    function collectRecordsFromPayload(payload, seen = new Set()) {
      if (Array.isArray(payload)) {
        return payload.flatMap((item) => collectRecordsFromPayload(item, seen));
      }
      if (!payload || typeof payload !== "object") return [];
      const keys = [
        "records", "items", "logs", "data", "rows", "latest", "latestLogs",
        "recentRecords", "actionRecords", "behaviorRecords", "studentRecords", "payloads"
      ];
      const records = [];
      keys.forEach((key) => {
        const value = payload[key];
        if (Array.isArray(value)) {
          value.forEach((item) => {
            if (!item || typeof item !== "object") return;
            const recordKey = [
              item.rowNumber, item.timestamp, item.createdAt, item.date,
              item.studentId, item.fullName, item.behaviorType,
              item["เลขประจำตัว"], item["ชื่อ - สกุล"], item["ประเภทพฤติกรรม"]
            ].join("|");
            if (seen.has(recordKey)) return;
            seen.add(recordKey);
            records.push(item);
          });
        } else if (value && typeof value === "object") {
          records.push(...collectRecordsFromPayload(value, seen));
        }
      });
      return records;
    }

    function currentAcademicYear() {
      const now = new Date();
      return now.getMonth() + 1 >= 5 ? now.getFullYear() : now.getFullYear() - 1;
    }

    function selectedDashboardMode() {
      if (selectedPeriod === "วัน") return "daily";
      if (selectedPeriod === "เดือน") return "monthly";
      return "academic";
    }

    function dashboardPeriodParams() {
      const params = {
        mode: selectedDashboardMode(),
        academicYear: currentAcademicYear()
      };
      if (selectedPeriod === "วัน") {
        params.date = selectedDateFrom || localIsoDate();
      } else if (selectedPeriod === "เดือน") {
        params.month = selectedMonth || localMonth();
      }
      return params;
    }

    function normalizeDashboardRecord(record = {}) {
      const fullName = firstFilled(
        record.fullName,
        record.studentName,
        record.name,
        record.fullname,
        record["ชื่อ - สกุล"],
        record["ชื่อสกุล"],
        record["ชื่อ"]
      );
      const studentId = firstFilled(
        record.studentId,
        record.studentID,
        record.id,
        record.code,
        record["เลขประจำตัว"],
        record["รหัสนักเรียน"]
      );
      const room = firstFilled(
        record.room,
        record.classRoom,
        record.class,
        record.levelRoom,
        record["ห้อง"],
        record["ชั้น"]
      );
      const behaviorType = firstFilled(
        record.behaviorType,
        record.type,
        record.category,
        record.behavior,
        record["ประเภทพฤติกรรม"],
        record["พฤติกรรม"]
      );
      const actionType = getActionText(record);
      const note = firstFilled(
        record.note,
        record.remark,
        record.description,
        record.detail,
        record.details,
        record["หมายเหตุ"],
        record["รายละเอียด"]
      );
      return {
        ...record,

        studentId,
        room: canonicalRoomName(room),
        number: studentNumberFrom(record),
        behaviorType: normalizeBehaviorName(behaviorType),
        actionType,
        note,
        date: getRecordDate(record),
        timestamp: firstFilled(record.timestamp, record.createdAt, record.recordedAt, record.date, record["วันที่"])
      };
    }

    function recordMatchesTarget(record, roomRaw, nameRaw) {
      if (selectedMode === "room") {
        return !roomRaw || normalizeRoomValue(record.room) === normalizeRoomValue(roomRaw);
      }
      if (!selectedStudent) return true;
      const sameId = selectedStudent.studentId && record.studentId && String(selectedStudent.studentId) === String(record.studentId);
      const sameName = selectedStudent.fullName && record.fullName && String(selectedStudent.fullName) === String(record.fullName);
      const sameRoom = !record.room || !selectedStudent.room || normalizeRoomValue(record.room) === normalizeRoomValue(selectedStudent.room);
      const typedName = nameRaw && record.fullName && String(record.fullName).includes(nameRaw);
      return Boolean(sameId || (sameName && sameRoom) || typedName);
    }

    async function loadDashboardReportFallback(roomRaw, nameRaw, behaviorTypes) {
      const dashboardParams = {
        ...dashboardPeriodParams(),
        room: selectedMode === "room" ? (roomRaw || "ALL") : "ALL"
      };
      const payloads = [];

      try {
        payloads.push(await jsonpFrom(DASHBOARD_GAS_URL, "getDashboard", dashboardParams));
      } catch (error) {
        console.warn("dashboard report fallback getDashboard failed", error);
      }

      try {
        payloads.push(await jsonpFrom(DASHBOARD_GAS_URL, "getLatestLogs", {limit: 1000}));
      } catch (error) {
        console.warn("dashboard report fallback getLatestLogs failed", error);
      }

      const records = collectRecordsFromPayload(payloads)
        .map(normalizeDashboardRecord)
        .filter((record) => recordMatchesTarget(record, roomRaw, nameRaw))
        .filter((record) => {
          if (!behaviorTypes.length) return true;
          return behaviorTypes.map(normalizeBehaviorName).includes(normalizeBehaviorName(record.behaviorType));
        });

      return mergeReports([{success: true, records}], behaviorTypes);
    }

    function studentNumberFrom(value = {}) {
      return firstFilled(
        value.number,
        value.studentNo,
        value.studentNumber,
        value.no,
        value.classNo,
        value.roomNo,
        value.noInRoom,
        value.student_no,
        value["เลขที่"]
      );
    }

    function getStudentNumber(record = {}) {
      const direct = studentNumberFrom(record);
      if (direct) return direct;
      const match = allStudents.find((student) => (
        (record.studentId && student.studentId && String(student.studentId) === String(record.studentId)) ||
        (record.fullName && student.fullName && String(student.fullName) === String(record.fullName) && (!record.room || String(student.room || "") === String(record.room || "")))
      ));
      return match ? studentNumberFrom(match) : "";
    }

    function getActionText(record = {}) {
      const direct = firstFilled(
        record.actionType,
        record.action,
        record.actionTaken,
        record.behaviorAction,
        record.management,
        record.manageType,
        record.status,
        record["การดำเนินการ"],
        record["ดำเนินการ"],
        record["การจัดการ"],
        record["สถานะ"]
      );
      if (direct) return normalizeActionName(direct);
      const noteText = String(record.note || "").trim();
      if (/^(ตักเตือน|เตือน|ปกครอง\s*[123๑๒๓]|ปกครองครั้งที่\s*[123๑๒๓])$/.test(noteText)) return normalizeActionName(noteText);
      return "";
    }

    function normalizeActionName(value) {
      const text = String(value || "").replace(/\s+/g, "").trim();
      if (!text) return "";
      if (text === "เตือน" || text === "ตักเตือน") return "ตักเตือน";
      if (/^ปกครอง(?:ครั้งที่)?[1๑]$/.test(text)) return "ปกครอง1";
      if (/^ปกครอง(?:ครั้งที่)?[2๒]$/.test(text)) return "ปกครอง2";
      if (/^ปกครอง(?:ครั้งที่)?[3๓]$/.test(text)) return "ปกครอง3";
      return String(value || "").trim();
    }

    function numberSortValue(value) {
      const text = String(value ?? "").trim();
      const match = text.match(/\d+/);
      return match ? Number(match[0]) : Number.POSITIVE_INFINITY;
    }

    function looksLikeStudentId(value) {
      return /^\d{3,}$/.test(String(value || "").trim());
    }

    function renderFields(mode, params, report) {

      const studentId = picked.studentId || first.studentId || (looksLikeStudentId(params.nameRaw) ? params.nameRaw : "") || "";
      const room = params.roomRaw || picked.room || first.room || "";

      const fields = [];

            ${!isHidden("studentNo") ? `<strong>เลขที่</strong><span class="line">${escapeHtml(number)}</span>` : ""}

    function renderPage(content, page, pageTotal, report, params) {

    function chunkArray(items, size) {
      const chunks = [];
      for (let i = 0; i < items.length; i += size) chunks.push(items.slice(i, i + size));
      return chunks.length ? chunks : [[]];
    }

    function packBlocks(blocks, maxUnits) {
      const pages = [];
      let current = [];
      let used = 0;

      blocks.forEach((block) => {
        if (current.length && used + block.units > maxUnits) {
          pages.push(current.join(""));
          current = [];
          used = 0;
        }
        current.push(block.html);
        used += block.units;
      });

      if (current.length) pages.push(current.join(""));
      return pages.length ? pages : [`<section class="doc-section"><div class="doc-empty">ไม่ปรากฏข้อมูล</div></section>`];
    }

    function renderPersonPages(report) {
      const grouped = groupBy(report.records || [], "behaviorType");

      if (!behaviorNames.length) {
        return [`<section class="doc-section"><div class="doc-empty">ไม่ปรากฏข้อมูล</div></section>`];
      }

      const blocks = [];
      behaviorNames.forEach((behaviorName) => {
        const rows = grouped[behaviorName];
        chunkArray(rows, 18).forEach((chunk, chunkIndex) => {
          const headers = [
            !isHidden("sectionCount") ? "<th>ครั้งที่</th>" : "",

          ].join("");
          blocks.push({
            units: 3 + chunk.length,
            html: `
          <section class="doc-section">

            </div>

              <tbody>
                ${chunk.map((record, index) => `
                  <tr>
                    ${!isHidden("sectionCount") ? `<td>${chunkIndex * 18 + index + 1}</td>` : ""}
                    ${!isHidden("recordDate") ? `<td>${escapeHtml(formatThaiDate(record.date))}</td>` : ""}
                    ${!isHidden("behaviorAction") ? `<td>${escapeHtml(getActionText(record))}</td>` : ""}
                    ${!isHidden("behaviorNote") ? `<td>${escapeHtml(record.note || "")}</td>` : ""}
                    ${headers ? "" : `<td>${escapeHtml(behaviorName)}</td>`}
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </section>
          `
          });
        });
      });
      return packBlocks(blocks, 25);
    }

    function renderRoomPages(report) {
      const records = report.records || [];
      const byBehavior = groupBy(records, "behaviorType");
      const behaviorNames = Object.keys(byBehavior).sort((a, b) => a.localeCompare(b, "th"));
      const showOrder = !isHidden("sectionCount");
      const showName = !isHidden("fullName");
      const showId = !isHidden("studentId");
      const showNo = !isHidden("studentNo");
      const showDetails = !isHidden("recordDate") || !isHidden("behaviorAction") || !isHidden("behaviorNote");
      const studentHeadersRaw = [

        showName ? "<th>ชื่อ - สกุล</th>" : "",
        showId ? "<th>เลขประจำตัว</th>" : "",
        showNo ? "<th>เลขที่</th>" : "",
        showOrder ? "<th class=\"center\">ครั้ง</th>" : "",
        showDetails ? "<th>รายการ</th>" : ""
      ].filter(Boolean);
      const studentHeaders = studentHeadersRaw.join("") || "<th>รายการ</th>";
      const columnCount = Math.max(studentHeadersRaw.length, 1);

      if (!behaviorNames.length) {
        return [`
          <section class="doc-section">
            <div class="section-head">
              <div><strong>ประเภทพฤติกรรม :</strong> ${escapeHtml(report.behaviorType || "ทั้งหมด")}</div>
              ${!isHidden("sectionCount") ? `<div><strong>จำนวน :</strong> 0 คน 0 ครั้ง</div>` : ""}
            </div>
            <div class="doc-empty">ไม่ปรากฏข้อมูล</div>
          </section>
        `];
      }

      const blocks = [];
      behaviorNames.forEach((behaviorName) => {
        const behaviorRecords = byBehavior[behaviorName] || [];
        const studentMap = {};
        behaviorRecords.forEach((record) => {
          const key = record.studentId || `${record.fullName || record.studentName || ""}|${record.room || ""}`;
          if (!studentMap[key]) {
            studentMap[key] = {
              studentId: record.studentId || "",
              fullName: record.fullName || record.studentName || "",
              number: getStudentNumber(record),
              logs: []
            };
          }
          if (!studentMap[key].number && getStudentNumber(record)) {
            studentMap[key].number = getStudentNumber(record);
          }
          studentMap[key].logs.push(record);
        });

        const students = Object.values(studentMap)
          .sort((a, b) => {
            const noDiff = numberSortValue(a.number) - numberSortValue(b.number);
            return noDiff || String(a.number || "").localeCompare(String(b.number || ""), "th", {numeric: true}) || String(a.fullName || "").localeCompare(String(b.fullName || ""), "th");
          });
        const totalText = `${students.length} คน ${behaviorRecords.length} ครั้ง`;
        const sortedStudents = students.map((student) => ({
          ...student,
          logs: student.logs
            .slice()
            .sort((a, b) => String(a.timestamp || a.date).localeCompare(String(b.timestamp || b.date)))
        }));

        chunkArray(sortedStudents, 18).forEach((chunk, pageIndex) => {
          const tableRows = chunk.map((student, chunkStudentIndex) => {
            const studentIndex = pageIndex * 18 + chunkStudentIndex;
            const logs = student.logs || [];
          const studentCells = [
            showOrder ? `<td>${studentIndex + 1}</td>` : "",
            showName ? `<td>${escapeHtml(student.fullName || "")}</td>` : "",
            showId ? `<td>${escapeHtml(student.studentId || "")}</td>` : "",
            showNo ? `<td class="center">${escapeHtml(student.number || "")}</td>` : "",
            showOrder ? `<td class="center">${logs.length}</td>` : "",
            showDetails ? `<td>
              <div class="room-log-lines">
                ${logs.map((record, index) => {
                  const actionText = getActionText(record);
                  const details = [
                    !isHidden("sectionCount") ? `<span class="muted">${index + 1}.</span>` : "",
                    !isHidden("recordDate") ? escapeHtml(formatThaiDate(record.date)) : "",
                    !isHidden("behaviorAction") && actionText ? escapeHtml(actionText) : "",
                    !isHidden("behaviorNote") && record.note ? escapeHtml(record.note) : ""
                  ].filter(Boolean).join(" - ");
                  return details ? `<div>${details}</div>` : "";
                }).join("") || "-"}
              </div>
            </td>` : ""
          ].filter(Boolean).join("") || `<td>${escapeHtml(student.fullName || student.studentId || "")}</td>`;
            return `<tr>${studentCells}</tr>`;
          });
          const unitWeight = chunk.reduce((sum, student) => sum + 1 + Math.min(4, (student.logs || []).length) * .42, 0);
          blocks.push({
            units: 3 + unitWeight,
            html: `
              <section class="doc-section room-compact">
                <div class="section-head">
                  <div><strong>ประเภทพฤติกรรม :</strong> ${escapeHtml(behaviorName)}${pageIndex ? " (ต่อ)" : ""}</div>
                  ${!isHidden("sectionCount") ? `<div><strong>จำนวน :</strong> ${escapeHtml(totalText)}</div>` : ""}
                </div>
                <table class="doc-table room-table room-compact-table">
                  <thead><tr>${studentHeaders}</tr></thead>
                  <tbody>
                    ${tableRows.join("")}
                  </tbody>
                </table>
              </section>
            `
          });
        });
      });

      return packBlocks(blocks, 42);
    }

    function renderDocument(report, params) {
      const pageContents = selectedMode === "room"
        ? renderRoomPages(report)
        : renderPersonPages(report);
      const pageTotal = pageContents.length || 1;
      document.getElementById("printSheets").innerHTML = pageContents
        .map((content, index) => renderPage(content, index + 1, pageTotal, report, params))
        .join("");
    }

    function mergeReports(reports, behaviorTypes) {
      const base = reports.find((item) => item && item.success) || {success: true, records: []};
      const seen = new Set();
      const records = [];

      reports.forEach((report) => {
        (report.records || []).forEach((record) => {
          const normalizedRecord = normalizeReportRecord(record);
          const key = [
            normalizedRecord.timestamp,
            normalizedRecord.studentId,
            normalizedRecord.date,
            normalizedRecord.behaviorType,
            getActionText(normalizedRecord),
            normalizedRecord.note
          ].join("|");
          if (seen.has(key)) return;
          seen.add(key);
          records.push(normalizedRecord);
        });
      });

      const filteredRecords = filterRecordsBySelectedPeriod(records);
      const byType = {};
      const byRoom = {};
      const byStudent = {};
      filteredRecords.forEach((record) => {
        const type = normalizeBehaviorName(record.behaviorType);
        const room = canonicalRoomName(record.room);
        const studentKey = [record.studentId, record.fullName, room].join("|");
        byType[type] = (byType[type] || 0) + 1;
        byRoom[room] = (byRoom[room] || 0) + 1;
        if (!byStudent[studentKey]) {
          byStudent[studentKey] = {
            studentId: record.studentId,
            fullName: record.fullName,
            room: record.room,
            number: getStudentNumber(record),
            count: 0
          };
        }
        if (!byStudent[studentKey].number && getStudentNumber(record)) {
          byStudent[studentKey].number = getStudentNumber(record);
        }
        byStudent[studentKey].count += 1;
      });

      return {
        ...base,
        success: true,
        total: filteredRecords.length,
        behaviorType: behaviorTypes.length ? behaviorTypes.join(", ") : "ทั้งหมด",
        byType,
        byRoom,
        topStudents: Object.values(byStudent)
          .sort((a, b) => b.count - a.count || String(a.fullName || "").localeCompare(String(b.fullName || ""), "th"))
          .slice(0, 50),
        records: filteredRecords.sort((a, b) => String(b.timestamp || b.date).localeCompare(String(a.timestamp || a.date)))
      };
    }

    document.getElementById("createPdf").addEventListener("click", async () => {
      if (!canCreateDocument()) {
        playTapTone("warning");
        vibrateFor("warning");
        updateCreateButtonState();
        return;
      }
      const button = document.getElementById("createPdf");
      const nameRaw = document.getElementById("studentName").value.trim();
      const roomRaw = selectedMode === "room"
        ? selectedReportRoom
        : (selectedStudent ? (selectedStudent.room || "") : "");
      const noRaw = selectedMode === "person" && selectedStudent ? (selectedStudent.number || "") : "";
      const name = nameRaw || "............................................................";
      const room = roomRaw || "....................";
      const no = noRaw || "....................";
      const behaviorTypes = selectedBehaviors.slice();
      const behavior = behaviorTypes.length ? behaviorTypes.join(", ") : "ทั้งหมด";

      button.disabled = true;
      button.textContent = "กำลังสร้างเอกสาร...";

      let report = null;
      try {
        const targets = behaviorTypes.length ? behaviorTypes : ["ทั้งหมด"];
        const reports = [];
        for (const behaviorType of targets) {
          const periodParams = buildReportPeriodParams();
          reports.push(await jsonp("getReportData", {
            reportMode: selectedMode,
            studentId: selectedMode === "person" && selectedStudent ? selectedStudent.studentId : "",
            studentName: selectedMode === "person" ? nameRaw : "",
            room: selectedMode === "room" ? roomRaw : "",
            // ไม่ส่ง studentNo ไปกรอง เพราะ BehaviorLogs ไม่มีเลขที่ และข้อมูลเก่า/ใหม่ไม่เท่ากัน
            studentNo: "",
            behaviorType,
            ...periodParams
          }));
        }
        report = mergeReports(reports, behaviorTypes);
        if (selectedMode === "room" && roomRaw) {
          const roomRecords = (report.records || []).filter((record) => normalizeRoomValue(record.room) === normalizeRoomValue(roomRaw));
          report = mergeReports([{...report, records: roomRecords}], behaviorTypes);
        }

        // รายห้อง: ถ้าหลังบ้านกรองห้องแล้วไม่เจอ ให้ดึงกว้างทั้งระบบแล้วกรองห้องในหน้าเว็บอีกครั้ง
        // ช่วยแก้กรณีชื่อห้อง/ช่วงเวลา/ข้อมูลเก่า-ใหม่ไม่ตรงกันระหว่าง Behavior กับ BehaviorLogs
        if (selectedMode === "room" && (!report.records || report.records.length === 0) && roomRaw) {
          const fallbackReports = [];
          for (const behaviorType of targets) {
            fallbackReports.push(await jsonp("getReportData", {
              reportMode: "room",
              room: "",
              studentNo: "",
              behaviorType,
              period: "all"
            }));
          }
          const fallback = mergeReports(fallbackReports, behaviorTypes);
          fallback.records = (fallback.records || []).filter((record) => normalizeRoomValue(record.room) === normalizeRoomValue(roomRaw));
          report = mergeReports([{...fallback, records: fallback.records}], behaviorTypes);
        }

        if ((!report.records || report.records.length === 0) && (roomRaw || selectedStudent)) {
          const dashboardFallback = await loadDashboardReportFallback(roomRaw, nameRaw, behaviorTypes);
          if (dashboardFallback.records && dashboardFallback.records.length) {
            report = dashboardFallback;
          }
        }
      } catch (error) {
        console.warn("GAS report fetch warning, rendering clean document:", error);
        report = { success: true, records: [], summary: { total: 0 } };
      }

      if (!report || !report.success) {
        report = { success: true, records: [], summary: { total: 0 } };
      }

      renderDocument(report, {nameRaw, roomRaw, noRaw, name, room, no, behavior, selectedStudent});
      playTapTone("success");
      vibrateFor("success");
      updateMobileSheetScale();
      document.body.classList.add("document-ready");
      openPreviewModal();

      updateCreateButtonState();
    });

    document.getElementById("downloadPdf").addEventListener("click", () => {
      downloadPdfDocument();
    });

    document.getElementById("closePreview").addEventListener("click", () => {
      closePreviewModal();
    });

    previewModal.addEventListener("click", (event) => {
      if (event.target === previewModal) closePreviewModal();
    });

    window.addEventListener("resize", updateMobileSheetScale);
    window.addEventListener("orientationchange", () => {
      window.setTimeout(updateMobileSheetScale, 180);
    });
    updateMobileSheetScale();
  </script>
